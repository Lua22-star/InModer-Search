<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InModer Search</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #1e1e1e;
            color: #f5f5f5;
            text-align: center;
        }
        h1 { color: #5cda3c; }
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }
        .mod-link {
            display: block;
            padding: 15px;
            background-color: #2a2a2a;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            border: 2px solid #444;
            transition: all 0.2s ease;
        }
        .mod-link:hover {
            border-color: #5cda3c;
            background-color: #333;
            transform: translateY(-2px);
        }
        .back-btn {
            margin-top: 30px;
            display: inline-block;
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
        }
        .back-btn:hover { color: #fff; }
    </style>
</head>
<body>

    <h1>Search Results</h1>

    <div class="links-container">
        <a class="mod-link" href="https://lua22-star.github.io/fabricmysha.github.io/">
            View Fabric Mods Website
        </a>
        <a class="mod-link" href="https://lua22-star.github.io/neoforgemysha.github.io/">
            View NeoForge Mods Website
        </a>
    </div>

    <a href="index.html" class="back-btn">← Go Back</a>

</body>
</html>
