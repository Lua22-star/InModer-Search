<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Pages Search</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; }
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        ul { list-style: none; padding: 0; }
        li { padding: 10px; border-bottom: 1px solid #eee; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h2>Search Content</h2>
    
    <!-- HTML Search Bar -->
    <div class="search-box">
        <input type="search" id="searchInput" placeholder="Type to search..." onkeyup="filterList()">
    </div>

    <!-- The List of Items to Search Through -->
    <ul id="itemList">
        <li class="search-item">How to learn PHP</li>
        <li class="search-item">HTML search bar tutorial</li>
        <li class="search-item">CSS flexbox guide</li>
        <li class="search-item">JavaScript for beginners</li>
        <li class="search-item">GitHub Pages deployment tips</li>
    </ul>

    <script>
        function filterList() {
            // 1. Get the text the user typed and convert to lowercase
            let input = document.getElementById('searchInput').value.toLowerCase();
            
            // 2. Grab all the items in our list
            let items = document.getElementsByClassName('search-item');

            // 3. Loop through every item and hide it if it doesn't match
            for (let i = 0; i < items.length; i++) {
                let text = items[i].textContent.toLowerCase();
                
                if (text.includes(input)) {
                    items[i].classList.remove('hidden'); // Show it
                } else {
                    items[i].classList.add('hidden');    // Hide it
                }
            }
        }
    </script>

</body>
</html>
