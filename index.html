<!doctype html>
<html lang="en">
  <head>
    <title>InModer Search</title>
  </head>
    <style>
		  html {
			  background-color: #e9e9e9;
			  display: flex;
  			  justify-content: center;
			  align-items: center;
		  }
		input[type=text] {
  			float: right;
  			padding: 6px;
  			border: none;
  			margin-top: 8px;
  			margin-right: 16px;
  			font-size: 17px;
		}

		@media screen and (max-width: 600px) {
  		input[type=text] {
    			float: none;
    			display: block;
    			text-align: left;
    			width: 100%;
    			margin: 0;
    			padding: 14px;
  		}
  		input[type=text] {
    			border: 1px solid #ccc;
  		}
		}
    </style>
  <body>
    <input type="text" placeholder="Search..">
  </body>
</html>
